[workspace]
members = [
    "crates/gixgiz-contracts",
    "crates/gixgiz-core",
    "crates/gixgiz-desktop-host",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/Phineas-bot/gixgiz"

[workspace.dependencies]
axum = { version = "0.8.6", default-features = false, features = ["http1", "json", "tokio"] }
http-body-util = "0.1.3"
schemars = { version = "1.2.2", features = ["uuid1"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.17"
tower = { version = "0.5.2", features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["fmt"] }
uuid = { version = "1.16.0", features = ["serde", "v4"] }
