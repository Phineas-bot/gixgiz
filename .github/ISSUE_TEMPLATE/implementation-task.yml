name: Implementation task
description: Define one focused, testable GixGiz engineering change
title: "[Task]: "
labels: []
body:
  - type: textarea
    id: context
    attributes:
      label: Context and user value
      description: Why is this change needed, and who benefits?
    validations:
      required: true
  - type: textarea
    id: desired
    attributes:
      label: Desired behavior
      description: Describe observable behavior rather than only an implementation preference.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope
      description: List the exact capability included in this issue.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Name adjacent work that must not be included.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Architecture, security and privacy constraints
      description: Link relevant specs, ADRs and AGENTS.md sections.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include success, failure, cancellation, unknown and permission states where relevant.
      placeholder: "- [ ] AC-1 ..."
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Required tests and validation
      description: List tests and exact commands expected before completion.
    validations:
      required: true
  - type: textarea
    id: docs
    attributes:
      label: Documentation or ADR impact
      description: Identify files that must be updated, or explain why none are required.
